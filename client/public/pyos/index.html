<div id="app-root"></div>
<div id="modal-layer"></div>
<div id="toast" class="toast"></div>
<script>
  // Si un navegador no puede interpretar alguno de los scripts de PyOS,
  // evita una pantalla vacía y muestra una indicación de recuperación.
  (function () {
    var startupErrorShown = false;
    function showStartupError() {
      var root = document.getElementById("app-root");
      if (startupErrorShown || !root || root.children.length) return;
      startupErrorShown = true;
      root.innerHTML =
        '<main role="alert" style="padding:24px;line-height:1.5">' +
        '<h1>PyOS no pudo iniciar</h1>' +
        '<p>Actualiza el navegador y vuelve a abrir la aplicación. Si el problema continúa, elimina esta instalación de PyOS e instálala nuevamente desde la versión publicada.</p>' +
        '</main>';
    }
    window.addEventListener("error", showStartupError, true);
    window.addEventListener("unhandledrejection", showStartupError);
  })();
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker
        .register("./sw.js")
        .then(function (registration) {
          return registration.update();
        })
        .catch(function (error) {
          console.warn("No se pudo actualizar PyOS para uso sin conexión.", error);
        });
    });
  }
</script>
